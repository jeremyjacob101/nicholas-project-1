services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: e2e_uploads_user
      POSTGRES_PASSWORD: e2e-postgres-password
      POSTGRES_DB: e2e_research_uploads
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    ports:
      - "35432:5432"
    volumes:
      - e2e_postgres_data:/var/lib/postgresql

  minio:
    image: minio/minio:RELEASE.2025-05-24T17-08-30Z
    environment:
      MINIO_ROOT_USER: e2e-minio-admin
      MINIO_ROOT_PASSWORD: e2e-minio-password
      MINIO_API_CORS_ALLOW_ORIGIN: "http://127.0.0.1:3513"
    ports:
      - "39000:9000"
      - "39001:9001"
    volumes:
      - e2e_minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  e2e_postgres_data:
  e2e_minio_data:
